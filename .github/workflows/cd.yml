name: ML Project CD

on:
  workflow_run:
    workflows: ["ML Project CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Deploy application, model, and results
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python -c "import os; from huggingface_hub import HfApi; HfApi(token=os.environ['HF_TOKEN']).upload_folder(folder_path='app', repo_id=os.environ['HF_SPACE_ID'], repo_type='space', commit_message='Deploy static application')"
          python -c "import os; from huggingface_hub import HfApi; HfApi(token=os.environ['HF_TOKEN']).upload_folder(folder_path='model', path_in_repo='model', repo_id=os.environ['HF_SPACE_ID'], repo_type='space', commit_message='Upload trained models')"
          python -c "import os; from huggingface_hub import HfApi; HfApi(token=os.environ['HF_TOKEN']).upload_folder(folder_path='results', path_in_repo='results', repo_id=os.environ['HF_SPACE_ID'], repo_type='space', commit_message='Upload evaluation results')"