
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Classification</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <h2>Drug Classification</h2>
    <p>Enter patient details to predict the drug category.</p>

    <label>Age:</label>
    <input type="number" id="age" min="1" max="120" required>
    <br><br>

    <label>Sex:</label>
    <select id="sex">
        <option value="F">F</option>
        <option value="M">M</option>
    </select>
    <br><br>

    <label>Blood Pressure:</label>
    <select id="bp">
        <option value="LOW">LOW</option>
        <option value="NORMAL">NORMAL</option>
        <option value="HIGH">HIGH</option>
    </select>
    <br><br>

    <label>Cholesterol:</label>
    <select id="cholesterol">
        <option value="NORMAL">NORMAL</option>
        <option value="HIGH">HIGH</option>
    </select>
    <br><br>

    <label>Na_to_K:</label>
    <input type="number" id="na" step="any" min="0.01" required>
    <br><br>

    <button id="predict">Predict</button>
    <p id="result">Loading model...</p>

    <script>
        let session = null;

        async function loadModel() {
            try {
                session = await ort.InferenceSession.create(
                    "./model/drug_model.onnx"
                );
                document.getElementById("result").textContent =
                    "Model loaded. Enter details and predict.";
            } catch (error) {
                document.getElementById("result").textContent =
                    "Model loading failed: " + error.message;
                console.error(error);
            }
        }

        document.getElementById("predict").addEventListener("click", async () => {
            const result = document.getElementById("result");

            if (!session) {
                result.textContent = "Model is not loaded. Check the model file path.";
                return;
            }

            const age = Number(document.getElementById("age").value);
            const na = Number(document.getElementById("na").value);

            if (!age || age < 1 || age > 120 ||
                !Number.isFinite(na) || na <= 0) {
                result.textContent = "Enter a valid age and Na_to_K value.";
                return;
            }

            result.textContent =
                "Model loaded, but input mapping must match the exported ONNX model.";

            console.log("Model inputs:", session.inputNames);
            console.log("Model outputs:", session.outputNames);
        });

        loadModel();
    </script>
</body>
</html>
