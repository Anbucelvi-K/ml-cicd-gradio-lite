<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Classification</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <h2>Drug Classification</h2>
    <p>Enter patient details to predict the drug category.</p>

    <label for="age">Age:</label>
    <input type="number" id="age" min="1" max="120" required>
    <br><br>

    <label for="sex">Sex:</label>
    <select id="sex">
        <option value="F">F</option>
        <option value="M">M</option>
    </select>
    <br><br>

    <label for="bp">Blood Pressure:</label>
    <select id="bp">
        <option value="LOW">LOW</option>
        <option value="NORMAL">NORMAL</option>
        <option value="HIGH">HIGH</option>
    </select>
    <br><br>

    <label for="cholesterol">Cholesterol:</label>
    <select id="cholesterol">
        <option value="NORMAL">NORMAL</option>
        <option value="HIGH">HIGH</option>
    </select>
    <br><br>

    <label for="na">Na_to_K:</label>
    <input type="number" id="na" min="0.01" step="any" required>
    <br><br>

    <button id="predict">Predict</button>
    <p id="result">Loading model...</p>

    <script>
        let session = null;

        async function loadModel() {
            const result = document.getElementById("result");

            try {
                session = await ort.InferenceSession.create(
                    "./model/drug_model.onnx"
                );
                result.textContent =
                    "Model loaded. Enter details and predict.";
            } catch (error) {
                console.error(error);
                result.textContent =
                    "Model loading failed: " + error.message;
            }
        }

        document.getElementById("predict").addEventListener("click", async () => {
            const result = document.getElementById("result");

            if (!session) {
                result.textContent = "Model is not loaded.";
                return;
            }

            const age = Number(document.getElementById("age").value);
            const na = Number(document.getElementById("na").value);

            if (
                document.getElementById("age").value === "" ||
                !Number.isFinite(age) ||
                age < 1 ||
                age > 120 ||
                document.getElementById("na").value === "" ||
                !Number.isFinite(na) ||
                na <= 0
            ) {
                result.textContent =
                    "Please enter a valid age and Na_to_K value.";
                return;
            }

            result.textContent = "Predicting...";

            try {
                const feeds = {
                    Age: new ort.Tensor("float32", [age], [1, 1]),
                    Sex: new ort.Tensor(
                        "string", [document.getElementById("sex").value], [1, 1]
                    ),
                    BP: new ort.Tensor(
                        "string", [document.getElementById("bp").value], [1, 1]
                    ),
                    Cholesterol: new ort.Tensor(
                        "string",
                        [document.getElementById("cholesterol").value],
                        [1, 1]
                    ),
                    Na_to_K: new ort.Tensor("float32", [na], [1, 1])
                };

                const output = await session.run(feeds);
                const predictedDrug = output.label.data[0];

                result.textContent = "Predicted Drug: " + predictedDrug;
            } catch (error) {
                console.error(error);
                result.textContent =
                    "Prediction failed. Check the browser console for details.";
            }
        });

        loadModel();
    </script>
</body>
</html>
