```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drug Classification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
        }

        .app {
            max-width: 640px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            height: 37px;
            padding: 6px;
            font-size: 15px;
        }

        .status {
            margin: 18px 0 14px;
            font-size: 14px;
        }

        .predict-button {
            width: 100%;
            height: 38px;
            font-size: 15px;
            cursor: pointer;
        }

        .result {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border: 1px solid #cccccc;
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <h1>Drug Classification</h1>

        <p class="subtitle">
            Drug classification using a machine learning model.
        </p>

        <form id="drugForm">

            <div class="form-grid">

                <div class="field">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="Age"
                           min="1" max="120" value="30" required>
                </div>

                <div class="field">
                    <label for="sex">Sex</label>
                    <select id="sex" name="Sex" required>
                        <option value="F">F</option>
                        <option value="M">M</option>
                    </select>
                </div>

                <div class="field">
                    <label for="bp">Blood Pressure Category</label>
                    <select id="bp" name="BP" required>
                        <option value="LOW">LOW</option>
                        <option value="NORMAL" selected>NORMAL</option>
                        <option value="HIGH">HIGH</option>
                    </select>
                </div>

                <div class="field">
                    <label for="cholesterol">Cholesterol Category</label>
                    <select id="cholesterol" name="Cholesterol" required>
                        <option value="NORMAL" selected>NORMAL</option>
                        <option value="HIGH">HIGH</option>
                    </select>
                </div>

                <div class="field">
                    <label for="na_to_k">Na_to_K Ratio</label>
                    <input type="number" id="na_to_k" name="Na_to_K"
                           min="0.1" max="100" step="any"
                           value="15.0" required>
                </div>

            </div>

            <div class="status" id="status" role="status">
                Model prediction is not connected yet.
            </div>

            <button class="predict-button" type="submit">
                Predict
            </button>

            <div class="result" id="result" role="status"></div>

        </form>

    </main>

    <script>
        const form = document.getElementById("drugForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            result.style.display = "block";
            result.textContent =
                "Connect the trained model to enable actual predictions.";
        });
    </script>

</body>
</html>
```
